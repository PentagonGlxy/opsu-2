name: Publish revival source

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-revival-source.yml

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/precise-timing-revival

      - name: Restore verified source snapshot
        run: |
          tar -xzf .github/workflows/revival-source.tar.gz
          rm -f android/assets/res

      - name: Commit source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish precise timing Android revival"
          git push origin HEAD:agent/precise-timing-revival
