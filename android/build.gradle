plugins {
    id "com.android.application"
}

android {
    namespace = "fluddokt.opsu.android"
    compileSdk = 36

    defaultConfig {
        applicationId = "fluddokt.opsu.android"
        minSdk = 21

        // Preserve the legacy shared-storage song/import workflow during the
        // first revival release. A Storage Access Framework migration will
        // allow this to be raised in a later release.
        targetSdk = 28

        versionCode = 3
        versionName = "0.17.0-alpha1"
        multiDexEnabled = true

        ndk {
            abiFilters += [
                "armeabi-v7a",
                "arm64-v8a",
                "x86",
                "x86_64"
            ]
        }
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.setSrcDirs(["src"])
            res.setSrcDirs(["res"])
            assets.setSrcDirs(["assets"])
            jniLibs.setSrcDirs(["libs"])
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/DEPENDENCIES.txt",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/robovm/ios/robovm.xml",
                "**/*.gwt.xml"
            ]
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".revival"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-project.txt"
            )
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "org.sqldroid:sqldroid:1.0.3"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

def generatedAssetsDir = layout.buildDirectory.dir("generated/opsuAssets")

tasks.register("syncCoreAssets", Sync) {
    from rootProject.file("core/res")
    into generatedAssetsDir.map { it.dir("res") }
}

android.sourceSets.main.assets.srcDir(generatedAssetsDir)

tasks.named("preBuild") {
    dependsOn tasks.named("syncCoreAssets")
}

tasks.register("copyAndroidNatives") {
    doFirst {
        file("libs/armeabi-v7a").mkdirs()
        file("libs/arm64-v8a").mkdirs()
        file("libs/x86").mkdirs()
        file("libs/x86_64").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) {
                outputDir = file("libs/armeabi-v7a")
            } else if (jar.name.endsWith("natives-arm64-v8a.jar")) {
                outputDir = file("libs/arm64-v8a")
            } else if (jar.name.endsWith("natives-x86.jar")) {
                outputDir = file("libs/x86")
            } else if (jar.name.endsWith("natives-x86_64.jar")) {
                outputDir = file("libs/x86_64")
            }

            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching {
    it.name.contains("merge") && it.name.contains("JniLibFolders")
}.configureEach {
    dependsOn tasks.named("copyAndroidNatives")
}
