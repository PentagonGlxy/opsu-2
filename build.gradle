buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    group = "fluddokt.opsu"
    version = "0.17.0-alpha1"

    repositories {
        google()
        mavenCentral()
    }
}

ext {
    appName = "opsu"
    gdxVersion = "1.14.2"
}

tasks.register("applyCorePatches") {
    group = "build setup"
    description = "Applies opsu! Android revival patches to the pinned core submodule."

    doLast {
        def coreDir = file("core")
        def patches = fileTree(dir: "patches/core", include: "*.patch").files.toList()
        patches.sort { a, b -> a.name <=> b.name }

        patches.each { patchFile ->
            def checkOutput = new ByteArrayOutputStream()
            def canApply = exec {
                workingDir coreDir
                commandLine "git", "apply", "--check", "--ignore-space-change", patchFile.absolutePath
                ignoreExitValue true
                standardOutput = checkOutput
                errorOutput = checkOutput
            }

            if (canApply.exitValue == 0) {
                exec {
                    workingDir coreDir
                    commandLine "git", "apply", "--ignore-space-change", patchFile.absolutePath
                }
                logger.lifecycle("Applied core patch: ${patchFile.name}")
            } else {
                def reverseCheckOutput = new ByteArrayOutputStream()
                def alreadyApplied = exec {
                    workingDir coreDir
                    commandLine "git", "apply", "--reverse", "--check", "--ignore-space-change", patchFile.absolutePath
                    ignoreExitValue true
                    standardOutput = reverseCheckOutput
                    errorOutput = reverseCheckOutput
                }
                if (alreadyApplied.exitValue != 0) {
                    throw new GradleException(
                        "Core patch does not apply cleanly: ${patchFile.name}\n" +
                        checkOutput.toString("UTF-8") +
                        reverseCheckOutput.toString("UTF-8")
                    )
                }
            }
        }
    }
}
